<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · erp-sales-receipt</title>
  <style>
    body { margin: 0; background: #6b6b6b; font-family: system-ui, sans-serif; }
    .toolbar {
      position: sticky; top: 0; display: flex; gap: .5rem; align-items: center;
      padding: .75rem 1rem; background: #1c1b18; color: #fff;
    }
    .toolbar button {
      font: inherit; padding: .45rem .9rem; border: 0; border-radius: 8px;
      background: #0091ce; color: #fff; cursor: pointer;
    }
    .stage { display: flex; justify-content: center; padding: 2rem 1rem; }
    /* El tiquet se ve sobre un "papel" con sombra. */
    erp-sales-receipt { box-shadow: 0 6px 24px rgba(0,0,0,.35); background: #fff; }

    /* Patrón de IMPRESIÓN (esto vive en el componente PADRE que usa el tiquet, no dentro del WC):
       al imprimir se oculta el chrome y solo sale el recibo. */
    @media print {
      .toolbar { display: none; }
      body { background: #fff; }
      .stage { padding: 0; }
      erp-sales-receipt { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>erp-sales-receipt</strong>
    <span style="opacity:.7">— preview presentacional</span>
    <span style="flex:1"></span>
    <button id="print">🖨 Imprimir</button>
  </div>

  <div class="stage">
    <erp-sales-receipt id="r"></erp-sales-receipt>
  </div>

  <!-- Bundle autocontenido del módulo (registra erp-sales-receipt + ok-qr + lit). -->
  <script type="module">
    import '../dist/sales.esm.js';

    const SAMPLE = {
      business: {
        name: 'Bar Pepe',
        address: 'C/ Mayor 1, 28013 Madrid',
        tax_id: 'NIF B12345678',
        phone: '600 123 123',
      },
      number: 'A-000142',
      datetime: '09/06/2026 14:32',
      cashier: 'Ana',
      customer: 'Juan García',
      lines: [
        { name: 'Café con leche', qty: 2, unit_price: 1.50, total: 3.00 },
        { name: 'Tostada con tomate', qty: 1, unit_price: 2.20, total: 2.20, note: 'sin sal' },
        { name: 'Zumo de naranja natural', qty: 1, unit_price: 2.80, total: 2.80 },
      ],
      subtotal: 8.00,
      taxes: [{ label: 'IVA 10%', base: 8.00, amount: 0.80 }],
      total: 8.80,
      payment: { method: 'Efectivo', paid: 10.00, change: 1.20 },
      currency: '€',
      footer: '¡Gracias por su visita!\nwww.barpepe.example',
      qr: 'https://prevalidacion.aeat.es/tikR/SmartRetail?nif=B12345678&num=A-000142&total=8.80',
      qr_note: 'Factura verificable en la sede electrónica de la AEAT (VeriFactu)',
    };

    document.getElementById('r').receipt = SAMPLE;
    document.getElementById('print').addEventListener('click', () => window.print());
  </script>
</body>
</html>
